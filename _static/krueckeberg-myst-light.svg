<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" role="img" aria-labelledby="title desc">
  <title id="title">Krückeberg logo in MyST-inspired style</title>
  <desc id="desc">A transparent SVG wordmark showing curly braces around the word Krückeberg in colors inspired by the MyST site logo.</desc>
  <style>
    .brace {
      fill: #ea580c;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 72px;
      letter-spacing: -0.03em;
    }
    .word {
      fill: #2563eb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: -0.03em;
    }
  </style>
  <rect width="100%" height="100%" fill="none"/>
  <text class="brace" x="34" y="79">{</text>
  <text class="word" x="85" y="78">Krückeberg</text>
  <text class="brace" x="410" y="79">}</text>
</svg>
